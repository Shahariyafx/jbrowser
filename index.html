<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>J Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="shader-scene">
    <div class="shader-sky"></div>
    <div class="shader-stars"></div>
    <div class="shader-moon"></div>
    <div class="terrain terrain-back"></div>
    <div class="terrain terrain-front"></div>
    <div class="shader-fog"></div>
    <div class="particle-layer" id="particleLayer"></div>
  </div>

  <div class="browser-shell">

    <header class="browser-header">
      <a href="#" class="brand" id="brandHome">
        <span class="brand-mark">J</span>
        <span>J BROWSER</span>
      </a>

      <div class="header-actions">
        <a href="credits.html" class="header-link">Credits</a>
        <button class="new-tab-button" id="newTabButton" type="button">New Tab</button>
      </div>
    </header>

    <div class="tabs-row" id="tabList"></div>

    <div class="browser-toolbar">
      <div class="navigation-controls">
        <button class="tool-button" id="backButton" type="button" aria-label="Back">BACK</button>
        <button class="tool-button" id="forwardButton" type="button" aria-label="Forward">NEXT</button>
        <button class="tool-button" id="refreshButton" type="button">REFRESH</button>
        <button class="tool-button" id="homeButton" type="button">HOME</button>
      </div>

      <form class="address-form" id="addressForm">
        <input
          id="addressInput"
          type="text"
          placeholder="Search or enter website address"
          autocomplete="off"
          spellcheck="false"
          aria-label="Address bar"
        >
        <button type="submit" class="address-go">GO</button>
      </form>
    </div>

    <main class="browser-content">

      <section class="home-screen" id="homeScreen">

        <div class="home-center">
          <img
            src="logo.png"
            alt="J Browser Logo"
            class="home-logo"
            onerror="this.hidden=true"
          >

          <div class="title-wrap">
            <h1 class="browser-title">J <span>BROWSER</span></h1>
            <p class="home-subtitle">A different way to explore the web.</p>
          </div>

          <form class="search-panel" id="searchForm">

            <div class="engine-control">
              <label class="engine-label" for="searchEngine">SEARCH WITH</label>
              <select id="searchEngine" aria-label="Choose search option">
                <option value="google">Google</option>
                <option value="bing">Bing</option>
                <option value="opera">Opera (Google)</option>
                <option value="firefox">Firefox (Google)</option>
              </select>
            </div>

            <div class="search-row">
              <input
                type="text"
                id="searchInput"
                placeholder="Search anything..."
                autocomplete="off"
                required
              >
              <button class="search-button" type="submit">SEARCH</button>
            </div>

          </form>

          <div class="quick-section">
            <p class="quick-heading">QUICK ACCESS</p>

            <div class="quick-links">
              <button class="quick-link" type="button" data-url="https://www.wikipedia.org/">Wikipedia</button>
              <button class="quick-link" type="button" data-url="https://www.youtube.com/">YouTube</button>
              <button class="quick-link" type="button" data-url="https://github.com/">GitHub</button>
              <button class="quick-link" type="button" data-url="https://www.google.com/">Google</button>
            </div>
          </div>

          <p class="home-footer">J BROWSER <span>·</span> EXPLORE WITHOUT LIMITS</p>
        </div>

      </section>

      <section class="page-screen" id="pageScreen" hidden>
        <div class="page-info">
          <span class="status-dot"></span>
          <span class="status-text" id="statusText">Loading website...</span>
          <button id="externalButton" type="button">OPEN EXTERNALLY</button>
        </div>

        <iframe
          id="webFrame"
          title="J Browser webpage"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="fullscreen; autoplay; clipboard-read; clipboard-write"
        ></iframe>
      </section>

    </main>

    <div class="browser-bottom">
      <span>J BROWSER</span>
      <span class="bottom-separator">|</span>
      <span>POWERED BY THE WEB</span>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
